<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weightloss Ledger</title>
<meta name="theme-color" content="#101114">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f3ef; --card: #ffffff; --ink: #0b0b0b; --muted: #6b6a66; --line: #e1e0d9; --track: #e6e5df;
  --blue: #2a78d6; --red: #d03b3b; --green: #1b9e3e; --amber: #b7791f; --chip: #ecebe6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101114; --card: #1a1b1f; --ink: #f0efec; --muted: #a3a29b; --line: #2c2d31; --track: #2c2d31;
    --blue: #5b9cf0; --red: #ef6b6b; --green: #3fbf63; --amber: #e0a94a; --chip: #25262b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; padding: 12px 14px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 10px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.muted { color: var(--muted); font-size: 13px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 11px 14px; background: var(--chip); color: var(--ink); cursor: pointer; }
button.primary { background: var(--blue); color: #fff; font-weight: 600; width: 100%; padding: 13px; }
button.ghost { background: none; padding: 6px 8px; color: var(--muted); }
button:disabled { opacity: .5; }
input, textarea { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); }
textarea { min-height: 84px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.streak { font-size: 17px; font-weight: 600; color: var(--green); }
.streak.broken { color: var(--red); }
.bar { margin: 12px 0 4px; }
.bar .top { display: flex; justify-content: space-between; font-size: 16px; }
.bar .track { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; margin: 5px 0 3px; }
.bar .fill { height: 100%; background: var(--blue); border-radius: 7px; }
.bar.over .fill { background: var(--red); }
.bar.over .left { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chips button { padding: 7px 10px; font-size: 13px; border-radius: 16px; }
.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; background: none; padding: 8px; }
.seg button.on { background: var(--card); font-weight: 600; }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
li:first-child { border-top: 0; }
li .cal { white-space: nowrap; font-variant-numeric: tabular-nums; }
.flag { color: var(--amber); font-size: 12px; display: block; }
.entry-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-top: 10px; }
#banner { border: 2px solid var(--amber); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; max-width: 90vw; display: none; z-index: 5; }
#toast.err { background: var(--red); color: #fff; }
svg text { fill: var(--muted); font-size: 12px; }
.hidden { display: none !important; }
label { font-size: 13px; color: var(--muted); display: block; margin: 10px 0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Weightloss Ledger</h1>
    <div><button class="ghost" id="refresh" aria-label="Refresh">Refresh</button><button class="ghost" id="open-settings" aria-label="Settings">Settings</button></div>
  </header>

  <section class="card hidden" id="settings">
    <h2>Settings</h2>
    <p class="muted">Paste a GitHub fine-grained token that can read and write <b>Contents</b> on the ledger repo only. It is stored on this device and sent only to api.github.com.</p>
    <label for="set-repo">Ledger repo</label>
    <input id="set-repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="owner/repo">
    <label for="set-token">GitHub token</label>
    <input id="set-token" type="password" autocomplete="off" placeholder="github_pat_...">
    <div class="row" style="margin-top:12px"><button id="save-settings" class="primary">Save and load</button></div>
    <div class="row" style="margin-top:8px"><button id="demo">Try with demo data</button><button id="forget">Forget token</button></div>
  </section>

  <div id="app" class="hidden">
    <section class="card hidden" id="banner">
      <h2 id="banner-title">Before you log today</h2>
      <p id="banner-text" style="margin:0 0 12px"></p>
      <div class="row"><button id="banner-none">Nothing after that</button><button id="banner-add">Add to yesterday</button></div>
      <p class="muted hidden" id="banner-hint" style="margin:10px 0 0">Log it below, then tap "Yesterday is complete".</p>
      <button class="hidden" id="banner-done" style="margin-top:10px;width:100%">Yesterday is complete</button>
    </section>

    <section class="card">
      <div class="streak" id="streak"></div>
      <div class="muted" id="streak-sub"></div>
      <div id="bars"></div>
    </section>

    <section class="card">
      <h2>Log food</h2>
      <div class="seg" id="day-seg"><button data-day="today" class="on">Today</button><button data-day="yesterday">Yesterday</button></div>
      <div class="row" style="margin:10px 0"><label style="margin:0;flex:0 0 auto" for="time">Time eaten</label><input id="time" type="time"></div>
      <textarea id="food" placeholder="200 g 2% milk, 1 scoop protein powder, a bag of broccoli"></textarea>
      <div class="chips" id="chips"></div>
      <ul id="preview"></ul>
      <button class="primary" id="log-food" disabled>Log</button>
    </section>

    <section class="card">
      <h2 id="entries-title">Today's entries</h2>
      <div id="entries"></div>
    </section>

    <section class="card">
      <h2>Weight</h2>
      <div class="row"><input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="lb"><button id="log-weight" style="flex:0 0 auto">Log weight</button></div>
      <p id="weight-line" style="margin:12px 0 6px"></p>
      <div id="chart"></div>
    </section>
    <p class="muted" id="foot" style="text-align:center"></p>
  </div>
</main>
<div id="toast" role="status"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
